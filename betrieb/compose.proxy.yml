# Gemeinsamer Webserver für Test und Live. Die Proxy-Netze werden hier angelegt,
# die App-Stapel der Umgebungen hängen sich als externe Netze daran.
services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    env_file:
      - proxy.env
    ports:
      - '${MYTCO_HTTP_PORT:-80}:80'
      - '${MYTCO_HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/umgebungen:/etc/caddy/umgebungen:ro
      - caddy-daten:/data
    networks:
      - proxy-test
      - proxy-live
    logging:
      driver: json-file
      options:
        max-size: 10m
        # Nur eine Datei: die Zeitgrenze (30 Tage) setzt logrotate auf dem Server (betrieb/server).
        max-file: '1'

volumes:
  caddy-daten:

networks:
  proxy-test:
    name: mytco-proxy-test
  proxy-live:
    name: mytco-proxy-live
