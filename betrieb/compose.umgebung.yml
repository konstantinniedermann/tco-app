# App und Datenbank einer Umgebung (test, live). Aufruf immer mit
# `-p mytco-<umgebung>`, `--env-file <umgebung>/geheim.env` und gesetztem
# MYTCO_UMGEBUNG und MYTCO_IMAGE (der Rauchtest nutzt dieselbe Datei mit Umgebung "rauch").
services:
  app:
    image: ${MYTCO_IMAGE:?MYTCO_IMAGE fehlt}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mytco:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@db:5432/mytco
      ORIGIN: ${ORIGIN:?ORIGIN fehlt}
      # Hinter Caddy: echte Client-Adresse aus dem letzten X-Forwarded-For-Eintrag.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      # Login mit Einmal-Codes (#29); ohne diese Werte startet die App nicht.
      MYTCO_CODE_SCHLUESSEL: ${MYTCO_CODE_SCHLUESSEL:?MYTCO_CODE_SCHLUESSEL fehlt}
      MYTCO_SMTP_URL: ${MYTCO_SMTP_URL:?MYTCO_SMTP_URL fehlt}
      MYTCO_MAIL_ABSENDER: ${MYTCO_MAIL_ABSENDER:?MYTCO_MAIL_ABSENDER fehlt}
      MYTCO_KONTAKT: ${MYTCO_KONTAKT:?MYTCO_KONTAKT fehlt}
      MYTCO_ADRESSE: ${MYTCO_ADRESSE:-}
      # Nur auf Test gesetzt: Mails werden an diese Adresse umgeleitet.
      MAIL_NUR_AN: ${MAIL_NUR_AN:-}
      # Push-Mitteilungen (#63, SI-22): optional, nur zusammen. Ohne Paar ist Push aus.
      MYTCO_VAPID_OEFFENTLICH: ${MYTCO_VAPID_OEFFENTLICH:-}
      MYTCO_VAPID_PRIVAT: ${MYTCO_VAPID_PRIVAT:-}
      # Interclub-Abruf (#81): holt die echten Resultate von Swiss Tennis, nur auf Test und Live
      # (DS-08: lokal und im E2E bleibt er aus).
      IC_ABRUF: ${IC_ABRUF:-an}
      IC_VEREIN: ${IC_VEREIN:-2202}
    networks:
      intern:
      proxy:
        aliases:
          - app-${MYTCO_UMGEBUNG:?MYTCO_UMGEBUNG fehlt}
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        # Nur eine Datei: die Zeitgrenze (30 Tage) setzt logrotate auf dem Server (betrieb/server).
        max-file: '1'

  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: mytco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: mytco
    volumes:
      # Postgres 18: Daten liegen in einem Unterordner von /var/lib/postgresql.
      - daten:/var/lib/postgresql
    healthcheck:
      # TCP statt Socket: der Init-Server beim ersten Start lauscht nur auf dem Socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U mytco -d mytco']
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - intern
    logging: *logging

  # Mail-Fänger, nur Test: nimmt jede Mail an und behält sie (nichts geht hinaus). Im internen
  # Netz heisst er mail.invalid; diese Adresse lässt die App auch in Produktion ohne TLS zu
  # (SI-17, nie ein echter Empfänger). Das Postfach liegt hinter dem Test-Passwort unter
  # /_mail/ (Caddy). Das Profil hält ihn aus jedem Start ohne Namen heraus; nur
  # `ausliefern test` startet ihn ausdrücklich.
  mailpit:
    image: axllent/mailpit:v1.33@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles: [mailfaenger]
    restart: unless-stopped
    environment:
      MP_WEBROOT: /_mail/
      MP_MAX_MESSAGES: '200'
      # Fragt sonst bei GitHub nach neuen Fassungen.
      MP_DISABLE_VERSION_CHECK: 'true'
    networks:
      intern:
        aliases:
          - mail.invalid
      proxy:
        aliases:
          - mailpit-${MYTCO_UMGEBUNG:?MYTCO_UMGEBUNG fehlt}
    logging: *logging

volumes:
  daten:

networks:
  # Kein Weg nach aussen: die Datenbank bleibt in diesem Netz.
  intern:
    internal: true
  # Vom Proxy-Stapel angelegt; daran hängen die App und auf Test der Mail-Fänger (für sein Postfach).
  proxy:
    external: true
    name: mytco-proxy-${MYTCO_UMGEBUNG:?MYTCO_UMGEBUNG fehlt}
