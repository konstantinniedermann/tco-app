version: 2
updates:
  # Hält die SHA-gepinnten GitHub Actions aktuell.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    labels:
      - 'chore'
      - 'infra'
      - 'P2'
  # Abhängigkeiten der App, des Docker-Images und der Compose-Datei.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    labels:
      - 'chore'
      - 'infra'
      - 'P2'
    groups:
      minor-und-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    labels:
      - 'chore'
      - 'infra'
      - 'P2'
    ignore:
      # Node-Hauptversion steuert `engines`/.nvmrc bewusst von Hand.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
      # Eine neue PostgreSQL-Hauptversion liest die Daten von Live nicht: Test (leeres Volume)
      # bestünde, Live fiele aus. Braucht einen eigenen Plan mit Dump und Wiederherstellung.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
      # Caddy-Hauptversionen können die Caddyfile-Syntax ändern: einzeln prüfen.
      - dependency-name: 'caddy'
        update-types: ['version-update:semver-major']
    groups:
      minor-und-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
      - '/betrieb'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    labels:
      - 'chore'
      - 'infra'
      - 'P2'
    # Wie beim Ökosystem docker: Hauptversionen von PostgreSQL und Caddy nur mit eigenem Plan.
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
      - dependency-name: 'caddy'
        update-types: ['version-update:semver-major']
    groups:
      minor-und-patch:
        update-types:
          - 'minor'
          - 'patch'
