name: Check

# Dieselben Prüfungen wie lokal `make check`, aber ohne docker compose (die DB kommt
# als Service-Container) und mit der OSV-Malware-Prüfung zusätzlich. Nur PRs und die
# beiden dauerhaften Branches — Feature-Branches deckt der lokale Hook ab (Actions-
# Minuten werden über alle privaten Repos geteilt). Reine Doku-Änderungen laufen nur
# durch den Job `doku`; die Code-Jobs hängen an `aenderung`.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # PR-Läufe teilen sich eine Gruppe pro Branch und brechen den vorherigen ab. Jeder
  # Push-Lauf hat eine eigene Gruppe: Eine Gruppe hält nur einen wartenden Lauf, ein dritter
  # Push würde den wartenden sonst verdrängen (dessen Code bliebe ungetestet).
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  doku:
    name: Doku (make docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nur für die Test-ID-Prüfung (Node-Bordmittel); kein npm ci, kein Cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make docs

  # Entscheidet, ob die Code-Jobs laufen. Fail closed: Im Zweifel (manueller Lauf,
  # neuer Branch, Basis-Commit fehlt) gilt die Änderung als Code.
  aenderung:
    name: Änderung (Code oder nur Doku)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.erkennen.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Die Einordnung läuft mit nur-doku.ts aus dem Basis-Commit, nicht aus dem geprüften
      # Stand: Eine Änderung kann sich so nicht selbst zur Doku erklären. Fehlt die Datei in
      # der Basis, gilt die Änderung als Code. nur-doku.ts darf daher nichts Lokales importieren.
      - name: Änderung erkennen
        id: erkennen
        env:
          EVENT: ${{ github.event_name }}
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          PUSH_BASIS: ${{ github.event.before }}
        run: |
          basis=""
          case "$EVENT" in
            pull_request) basis="$PR_BASIS" ;;
            push) basis="$PUSH_BASIS" ;;
          esac
          code=true
          if [ -n "$basis" ] && [ "$basis" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${basis}^{commit}" 2>/dev/null; then
            if git show "${basis}:scripts/pruefungen/nur-doku.ts" > "$RUNNER_TEMP/nur-doku.ts" \
              && git diff --name-only --no-renames "$basis" HEAD > "$RUNNER_TEMP/geaendert.txt"; then
              if node "$RUNNER_TEMP/nur-doku.ts" < "$RUNNER_TEMP/geaendert.txt"; then
                code=false
              fi
            fi
          fi
          echo "Basis: ${basis:-keine} -> code=${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  pruefen:
    name: Prüfen (Lint, Tests, Build)
    needs: aenderung
    if: needs.aenderung.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mytco
          POSTGRES_PASSWORD: mytco_lokal
          POSTGRES_DB: mytco
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mytco -d mytco"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mytco:mytco_lokal@localhost:55432/mytco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --no -- svelte-kit sync
      - run: npm run lint
      - run: npm run check:svelte
      - run: npm run pruefungen
      - run: npm test
      - run: npm run build
      - run: npm run build:spa

  e2e:
    name: E2E (Playwright)
    needs: aenderung
    if: needs.aenderung.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mytco
          POSTGRES_PASSWORD: mytco_lokal
          POSTGRES_DB: mytco
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mytco -d mytco"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # Fängt die Code-Mails; die Login-Tests lesen sie über die API (Port 58025).
      mail:
        image: axllent/mailpit:v1.33
        ports:
          - 51025:1025
          - 58025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # Wie .env.example; MYTCO_ADRESSE ist die baseURL von Playwright (Port 4173 ohne E2E_PORT).
    env:
      DATABASE_URL: postgres://mytco:mytco_lokal@localhost:55432/mytco
      MYTCO_CODE_SCHLUESSEL: nur-lokal-nicht-fuer-produktion-0123456789abcdef
      MYTCO_SMTP_URL: smtp://localhost:51025
      MYTCO_MAIL_ABSENDER: 'MyTCO <mytco@example.org>'
      MYTCO_KONTAKT: 'das Sekretariat (erfunden), sekretariat@example.org'
      MYTCO_ADRESSE: http://localhost:4173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --no -- svelte-kit sync
      - run: npm run e2e:browser
      - run: npm run e2e
      - name: Ergebnisse und Screenshots sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  malware:
    name: Malware-Prüfung (OSV)
    needs: aenderung
    if: needs.aenderung.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Malware-Gate übers ganze Lockfile (inkl. Dev- und transitive Deps): blockt nur
      # OSV-Einträge mit Prefix MAL-. Binary gepinnt und per SHA-256 verifiziert,
      # gleiche Version wie Munica.
      - name: osv-scanner installieren
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  /tmp/osv-scanner" | sha256sum -c -
      - name: package-lock.json scannen
        run: |
          ec=0
          /tmp/osv-scanner scan --lockfile=package-lock.json --format json > /tmp/osv.json || ec=$?
          # exit 1 = "Findings vorhanden" (normal, wird vom Gate gefiltert);
          # alles > 1 = echter Scanner-Fehler -> fail closed.
          if [ "$ec" -gt 1 ]; then
            echo "osv-scanner fehlgeschlagen (exit $ec)"; exit "$ec"
          fi
          python3 scripts/ci/osv_malware_gate.py /tmp/osv.json

  image:
    name: Docker-Image
    needs: aenderung
    if: needs.aenderung.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mytco:ci .
      # Rauchtest des Codes: Das hier gebaute Image muss starten und seine Prüfpunkte bestehen.
      # Ausgeliefert wird ein Neubau aus `bauen` (nicht bitgleich); dieses Image prüft auf Test die
      # Statusabfrage der Auslieferung, bevor `freigeben` es für Live kennzeichnet.
      - name: Rauchtest
        run: bash betrieb/nachweis/rauchtest.sh mytco:ci

  # --- Auslieferung ---------------------------------------------------------------------
  # Alle folgenden Jobs sind ausgeschaltet, solange die Repo-Variablen AUSLIEFERUNG_TEST
  # bzw. AUSLIEFERUNG_LIVE nicht auf `an` stehen. Test und Live bekommen dasselbe Image:
  # `bauen` (dev) baut und pusht es unter dem Commit, `ausliefern` übergibt nur den Digest an
  # den Türsteher des Servers, `freigeben` setzt erst nach geglückter Auslieferung auf Test das
  # Kennzeichen des Code-Stands, `finden` (main) sucht über dieses Kennzeichen genau das
  # Image wieder, das auf Test lief.

  bauen:
    name: Bauen (Image nach GHCR, für Test)
    needs: [aenderung, doku, pruefen, e2e, malware, image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && needs.aenderung.outputs.code == 'true' && vars.AUSLIEFERUNG_TEST == 'an'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.pushen.outputs.digest }}
      stand: ${{ steps.pushen.outputs.stand }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bauen und pushen
        id: pushen
        env:
          TOKEN: ${{ github.token }}
          AKTEUR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          repo="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          stand=$(bash scripts/ci/code-stand.sh)
          docker build -t "$repo:commit-$COMMIT" .
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$AKTEUR" --password-stdin
          docker push "$repo:commit-$COMMIT"
          digest=$(docker buildx imagetools inspect "$repo:commit-$COMMIT" --format '{{.Manifest.Digest}}')
          if ! printf '%s\n' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "Digest nicht lesbar"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "stand=$stand" >> "$GITHUB_OUTPUT"

  finden:
    name: Finden (Image von Test, für Live)
    needs: [aenderung, doku, pruefen, e2e, malware, image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.aenderung.outputs.code == 'true' && vars.AUSLIEFERUNG_LIVE == 'an'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.suchen.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image zum Code-Stand suchen
        id: suchen
        env:
          TOKEN: ${{ github.token }}
          AKTEUR: ${{ github.actor }}
        run: |
          repo="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          stand=$(bash scripts/ci/code-stand.sh)
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$AKTEUR" --password-stdin
          digest=$(docker buildx imagetools inspect "$repo:code-$stand" --format '{{.Manifest.Digest}}' 2>/dev/null) || digest=""
          if ! printf '%s\n' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "Kein auf Test ausgeliefertes Image zu diesem Code-Stand"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Vorab, noch vor der Auslieferung auf Live: Das Release muss sich danach anlegen lassen.
      # Version gültig, Text in docs/versionen.md vorhanden, Tag noch frei.
      - name: Release vorab prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Version in package.json nicht lesbar: $version"
            exit 1
          fi
          if ! bash scripts/ci/versionsnotizen.sh "$version" | grep -q '[^[:space:]]'; then
            echo "Kein Abschnitt für Version $version in docs/versionen.md"
            exit 1
          fi
          if ausgabe=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1); then
            echo "Der Tag v$version existiert bereits; Version in package.json erhöhen"
            exit 1
          fi
          case "$ausgabe" in
            *"HTTP 404"*) ;;
            *) echo "Tag-Prüfung gescheitert: $ausgabe"; exit 1 ;;
          esac

  # Nur `run:`-Schritte, keine Fremd-Actions: Dieser Job hält die SSH-Schlüssel (geprüft von
  # scripts/pruefungen/workflow-rechte.ts). Ausgabe ausschliesslich `ok` oder `fehler`.
  ausliefern:
    name: Ausliefern (SSH an den Türsteher)
    needs: [bauen, finden]
    if: ${{ !cancelled() && (needs.bauen.result == 'success' || needs.finden.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ausliefern-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Digest übergeben
        env:
          ZWEIG: ${{ github.ref_name }}
          SCHLUESSEL_TEST: ${{ secrets.SSH_SCHLUESSEL_TEST }}
          SCHLUESSEL_LIVE: ${{ secrets.SSH_SCHLUESSEL_LIVE }}
          BEKANNTE_HOSTS: ${{ secrets.SSH_BEKANNTE_HOSTS }}
          SERVER: ${{ secrets.SERVER_ADRESSE }}
          TOKEN: ${{ github.token }}
          DIGEST_BAUEN: ${{ needs.bauen.outputs.digest }}
          DIGEST_FINDEN: ${{ needs.finden.outputs.digest }}
        run: |
          umask 077
          ordner=$(mktemp -d)
          trap 'rm -rf "$ordner"' EXIT
          # Der Zweig bestimmt Schlüssel und Digest; es gibt keinen Rückfall auf den anderen.
          schluessel=""
          digest=""
          case "$ZWEIG" in
            dev) schluessel="$SCHLUESSEL_TEST"; digest="$DIGEST_BAUEN" ;;
            main) schluessel="$SCHLUESSEL_LIVE"; digest="$DIGEST_FINDEN" ;;
          esac
          if [ -n "$schluessel" ] && [ -n "$digest" ] && [ -n "$SERVER" ] && [ -n "$BEKANNTE_HOSTS" ]; then
            printf '%s\n' "$schluessel" > "$ordner/schluessel"
            printf '%s\n' "$BEKANNTE_HOSTS" > "$ordner/hosts"
            if printf '%s' "$TOKEN" | ssh -i "$ordner/schluessel" \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ordner/hosts" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              mytco@"$SERVER" "$digest" >/dev/null 2>&1; then
              echo ok
              exit 0
            fi
          fi
          echo fehler
          exit 1

  # Erst nach geglückter Auslieferung auf Test bekommt das Image das Kennzeichen seines
  # Code-Stands; `finden` sieht so nur Images, die auf Test wirklich liefen.
  freigeben:
    name: Freigeben (Code-Stand-Kennzeichen setzen)
    needs: [bauen, ausliefern]
    # Ausdrücklich über die Ergebnisse statt des stillen success(): Das prüft die ganze Kette
    # der Vorgänger, und auf dev ist `finden` (Vorgänger von `ausliefern`) übersprungen.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && needs.bauen.result == 'success' && needs.ausliefern.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Kennzeichen setzen
        env:
          TOKEN: ${{ github.token }}
          AKTEUR: ${{ github.actor }}
          DIGEST: ${{ needs.bauen.outputs.digest }}
          STAND: ${{ needs.bauen.outputs.stand }}
        run: |
          if ! printf '%s\n' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' \
            || ! printf '%s\n' "$STAND" | grep -Eqx '[0-9a-f]{40}'; then
            echo "Digest oder Code-Stand nicht lesbar"
            exit 1
          fi
          repo="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$AKTEUR" --password-stdin
          docker buildx imagetools create -t "$repo:code-$STAND" "$repo@$DIGEST"

  release:
    name: Release (Tag und GitHub-Release)
    needs: ausliefern
    # Wie bei `freigeben`: Auf main ist `bauen` übersprungen, das stille success() würde das
    # Release dauerhaft überspringen.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ausliefern.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          bash scripts/ci/versionsnotizen.sh "$version" > "$RUNNER_TEMP/notizen.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notizen.md"; then
            echo "Kein Abschnitt für Version $version in docs/versionen.md"
            exit 1
          fi
          gh release create "v$version" --target "$COMMIT" --title "v$version" \
            --notes-file "$RUNNER_TEMP/notizen.md"
