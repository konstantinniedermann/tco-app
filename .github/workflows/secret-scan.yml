name: Secret-Scan

# Ohne paths-Filter (ein Secret kann in jeder Datei landen): auf PRs und auf dev/main.
# Commits auf Feature-Branches deckt vorher der lokale pre-commit-Hook ab. GitHub prüft das
# öffentliche Repo zusätzlich selbst (mit Sperre beim Push); gitleaks bleibt, weil derselbe
# Scan auch lokal im pre-commit-Hook läuft. Muster aus Munica.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (ganze Historie)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binary statt fremder Action, checksum-verifiziert.
      - name: gitleaks installieren
        run: |
          V=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # Wiederholt kurze Störungen von GitHub (z. B. 504); die Prüfsumme danach bleibt gleich streng.
          curl -sSfL --retry 5 --retry-delay 15 --retry-connrefused -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Historie scannen
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .
