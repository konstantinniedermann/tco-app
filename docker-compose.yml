# Nur lokale Entwicklung und Tests. Kein echtes Passwort.
# Fester Projektname: alle Worktrees teilen denselben Container (Port 55432).
name: mytco
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mytco
      POSTGRES_PASSWORD: mytco_lokal
      POSTGRES_DB: mytco
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mytco -d mytco']
      interval: 2s
      timeout: 3s
      retries: 20
  # Fängt alle Mails ab, die die App lokal und in den E2E-Tests verschickt (SMTP 51025).
  # Ansehen unter http://localhost:58025; die E2E-Tests lesen die Codes über die API dort.
  mail:
    image: axllent/mailpit:v1.33
    ports:
      - '51025:1025'
      - '58025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 20
