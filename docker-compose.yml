# Nur lokale Entwicklung und Tests. Kein echtes Passwort.
# Fester Projektname: alle Worktrees teilen denselben Container (Port 55432).
# Ports nur auf 127.0.0.1: sonst liest im selben WLAN jeder die Login-Codes in Mailpit mit
# (wichtig bei `make dev-handy`).
name: mytco
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mytco
      POSTGRES_PASSWORD: mytco_lokal
      POSTGRES_DB: mytco
    ports:
      - '127.0.0.1:55432:5432'
    # Benannter Speicher: übersteht `docker compose down` (ohne -v) und neue Container, sonst
    # wären Seed-Daten und Handy-Logins aus `make dev-handy` weg. Ab Postgres 18 liegen die
    # Daten unter /var/lib/postgresql, nicht mehr unter …/data.
    volumes:
      - daten:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mytco -d mytco']
      interval: 2s
      timeout: 3s
      retries: 20
  # Fängt alle Mails ab, die die App lokal und in den E2E-Tests verschickt (SMTP 51025).
  # Ansehen unter http://localhost:58025; die E2E-Tests lesen die Codes über die API dort.
  mail:
    image: axllent/mailpit:v1.33
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  daten:
